# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "07:00"
      timezone: "Europe/London"
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
      pip-major:
        update-types:
          - "major"
    labels: ["dependencies", "uv", "automation"]
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(uv)"

  # GitHub Actions in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "07:00"
      timezone: "Europe/London"
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        update-types:
          - "major"
    labels: ["dependencies", "github-actions", "automation"]
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(github-actions)"

  # Pre-commit hooks
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "07:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    groups:
      pre-commit-minor-patch:
        update-types:
          - "minor"
          - "patch"
      pre-commit-major:
        update-types:
          - "major"
    labels: ["dependencies", "pre-commit", "automation"]
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(pre-commit)"
