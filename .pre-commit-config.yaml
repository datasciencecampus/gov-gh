default_install_hook_types: [pre-commit, commit-msg]

repos:
# exclude: ^vendor/

# ---- Pre-commit hooks ---- : Standard hook library
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  -   id: trailing-whitespace # strip out white spaces at end of lines
  -   id: end-of-file-fixer # ensure newline present at end of file
  -   id: check-yaml # checks yaml files for parseable syntax.
  -   id: check-json # checks json files for parseable syntax
  -   id: check-added-large-files # check for files above certain size (as likely to be data files)
      args: ['--maxkb=500']
  -   id: detect-private-key # detects the presence of private keys.
  -   id: check-case-conflict # check for files that would conflict in case-insensitive file systems.
  -   id: check-merge-conflict # check for files that contain merge conflict strings.

# ----- Detect-secrets - Detects high entropy strings that are likely to be passwords.
-   repo: https://github.com/Yelp/detect-secrets
    rev: 68e8b45440415753fff70a312ece8da92ba85b4a  # frozen: v1.5.0
    hooks:
    -   id: detect-secrets
        args: ["--baseline", "configs/.secrets.baseline"]
        exclude: '(^package\.lock\.json$|^configs/\.secrets\.baseline$|^\.pre-commit-config\.yaml$)'

# ----- Conventional commits - Enforces Conventional Commits format in commit messages.
-   repo: https://github.com/compilerla/conventional-pre-commit
    rev: 3db014c16a9d31997ab8c07a4d61fcce936c8f0d  # frozen: v4.4.0
    hooks:
    -   id: conventional-pre-commit
        stages: [commit-msg]

# ----- Ruff - Fast Python linter and formatter.
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 65dbdb59d2f2d9c3bdc343c566821ad3319ddaa3  # frozen: v0.16.3
    hooks:
    -   id: ruff
    -   id: ruff-format

# ----- Checkov - Security checks for GitHub Actions workflows.
-   repo: local
    hooks:
    -   id: checkov-github-actions
        name: checkov-github-actions
        entry: uvx --with checkov checkov --directory .github/workflows --framework github_actions --quiet
        language: system
        pass_filenames: false
